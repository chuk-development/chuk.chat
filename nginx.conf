# App screenshots come live from the public chuk_chat repo on GitHub.
# 127.0.0.1:8081 fetches and resizes them, the public /app-shots/ location
# caches the result. Visitors never contact GitHub, and a new screenshot
# pushed to chuk_chat shows up here within 10 minutes.
proxy_cache_path /var/cache/nginx/app-shots levels=1:2 keys_zone=app_shots:10m max_size=300m inactive=30d use_temp_path=off;

server {
    listen 127.0.0.1:8081;
    resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;

    # Only these widths and these repo paths. Anything else is a 404,
    # so this is not an open proxy.
    location ~ "^/(?<w>480|960|1600|2400)/(?<p>(assets/screenshots/[a-z0-9_]+\.webp|fastlane/metadata/android/(en-US|de-DE)/images/phoneScreenshots/[a-z0-9_]+\.png))$" {
        proxy_pass https://raw.githubusercontent.com/chuk-development/chuk_chat/master/$p;
        proxy_ssl_server_name on;
        proxy_set_header Host raw.githubusercontent.com;
        image_filter resize $w -;
        image_filter_buffer 25M;
        image_filter_webp_quality 82;
        image_filter_interlace on;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name chuk.chat www.chuk.chat;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # ──────────────────────────────────────────────────────────
    # Security headers — defined as variables so every location
    # block can emit them via a single include-style pattern.
    # (nginx discards parent add_header when a location block
    # defines its own, so we must repeat them everywhere.)
    # ──────────────────────────────────────────────────────────

    # Redirect root-level pages to /en/ (preserving query params)
    location = /subscription {
        return 301 /en/subscription/$is_args$args;
    }
    location = /pricing {
        return 301 /en/pricing/$is_args$args;
    }
    location = /downloads {
        return 301 /en/downloads/$is_args$args;
    }
    location = /support {
        return 301 /en/support/$is_args$args;
    }
    location = /privacy {
        return 301 /en/privacy/$is_args$args;
    }
    location = /terms {
        return 301 /en/terms/$is_args$args;
    }
    location = /impressum {
        return 301 /en/impressum/$is_args$args;
    }
    location = /faq {
        return 301 /en/faq/$is_args$args;
    }
    location = /cancellation {
        return 301 /en/cancellation/$is_args$args;
    }

    # HTML pages - no caching so deploys are instant
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://keepandroidopen.org https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com https://api.stripe.com; frame-src https://js.stripe.com; font-src 'self'; base-uri 'self'; form-action 'self' https://mail.chuk.chat" always;
    }

    # Handle clean URLs - try files with .html extension
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://keepandroidopen.org https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com https://api.stripe.com; frame-src https://js.stripe.com; font-src 'self'; base-uri 'self'; form-action 'self' https://mail.chuk.chat" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # App screenshots, proxied from GitHub (see the 8081 server above).
    # ^~ keeps the long-cache image regex below from taking these.
    location ^~ /app-shots/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_cache app_shots;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-GitHub-Request-Id;
        proxy_hide_header x-github-edge-region;
        proxy_hide_header Via;
        proxy_hide_header X-Served-By;
        proxy_hide_header X-Cache;
        proxy_hide_header X-Cache-Hits;
        proxy_hide_header X-Timer;
        proxy_hide_header X-Fastly-Request-ID;
        proxy_hide_header Source-Age;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Cache-Control "public, max-age=600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Cache static assets (fingerprinted CSS/JS safe to cache long)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Error pages
    error_page 404 /en/404.html;
}
