{{- /* Artifact card in the thread: 36x44 tile, title, subtitle, Download / Open. */ -}}
<div class="a-art">
    <span class="a-art-tile"><svg class="i20"><use href="#h-{{ .icon }}"/></svg></span>
    <span class="a-art-txt"><b>{{ .title }}</b><small>{{ .sub }}</small></span>
    <span class="a-art-btn">{{ .p.ui.download }}</span>
    <span class="a-art-btn">{{ .p.ui.open }}</span>
</div>
