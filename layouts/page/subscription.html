{{ define "main" }}
<div class="status-card" id="status-content">
    <!-- Content will be injected by JavaScript -->
</div>
{{ end }}

{{ define "head" }}
<style>
    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - var(--top-bar-height));
    }
    .footer {
        margin-top: auto;
    }
    .status-card {
        background: var(--card-bg);
        border: 1px solid var(--border-solid);
        padding: 48px 40px;
        text-align: center;
        max-width: 500px;
        width: 100%;
    }
    .status-icon {
        width: 64px;
        height: 64px;
        border: 2px solid var(--border-solid);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px auto;
        font-size: 32px;
    }
    .status-icon.success {
        border-color: var(--success);
        color: var(--success);
    }
    .status-icon.error {
        border-color: var(--error);
        color: var(--error);
    }
    .status-icon.warning {
        border-color: var(--accent);
        color: var(--accent);
    }
    .status-card h1 {
        font-size: 24px;
        font-weight: bold;
        margin: 0 0 16px 0;
        border-bottom: none;
        padding-bottom: 0;
    }
    .status-card p {
        margin: 0 0 24px 0;
        color: var(--text-secondary);
    }
    .status-card .cta-button {
        display: inline-block;
        background: var(--text-color);
        color: var(--bg-color);
        border: none;
        padding: 12px 24px;
        font-family: inherit;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s;
    }
    .status-card .cta-button:hover {
        background: var(--accent);
    }
    .status-card .secondary-link {
        display: block;
        margin-top: 16px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 14px;
    }
    .status-card .secondary-link:hover {
        color: var(--accent);
    }
    .details-box {
        background: var(--highlight-bg);
        border: 1px dashed var(--border-dotted);
        padding: 16px;
        margin-top: 24px;
        text-align: left;
    }
    .details-box h3 {
        margin: 0 0 12px 0;
        font-size: 14px;
        font-weight: bold;
    }
    .details-box ul {
        margin: 0;
        padding-left: 20px;
        color: var(--text-secondary);
        font-size: 14px;
    }
    .details-box li {
        margin-bottom: 6px;
    }
</style>
{{ end }}

{{ define "scripts" }}
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const isSuccess = urlParams.get('success') === 'true';
    const isCanceled = urlParams.get('canceled') === 'true';
    const isSignup = urlParams.get('signup') === 'success';
    const statusContent = document.getElementById('status-content');

    const homeUrl = '{{ "/" | relLangURL }}';
    const pricingUrl = '{{ "pricing" | relLangURL }}';
    const supportUrl = '{{ "support" | relLangURL }}';
    const downloadsUrl = '{{ "downloads" | relLangURL }}';

    if (isSuccess) {
        statusContent.innerHTML = `
            <div class="status-icon success">&#10003;</div>
            <h1>{{ .Params.success_title }}</h1>
            <p>{{ .Params.success_message }}</p>
            <a href="${downloadsUrl}" class="cta-button">{{ .Params.success_cta }}</a>
            <a href="${homeUrl}" class="secondary-link">{{ if eq .Lang "de" }}Zur Startseite{{ else }}Back to Home{{ end }} &rarr;</a>
        `;
    } else if (isCanceled) {
        statusContent.innerHTML = `
            <div class="status-icon warning">&#8617;</div>
            <h1>{{ .Params.canceled_title }}</h1>
            <p>{{ .Params.canceled_message }}</p>
            <a href="${pricingUrl}" class="cta-button">{{ .Params.canceled_cta }}</a>
            <a href="${homeUrl}" class="secondary-link">{{ if eq .Lang "de" }}Zur Startseite{{ else }}Back to Home{{ end }} &rarr;</a>
        `;
    } else if (isSignup) {
        statusContent.innerHTML = `
            <div class="status-icon success">&#10003;</div>
            <h1>{{ .Params.signup_title }}</h1>
            <p>{{ .Params.signup_message }}</p>
            <a href="${downloadsUrl}" class="cta-button">{{ .Params.signup_cta }}</a>
            <a href="${homeUrl}" class="secondary-link">{{ if eq .Lang "de" }}Zur Startseite{{ else }}Back to Home{{ end }} &rarr;</a>
        `;
    } else if (window.location.search === '' || urlParams.has('session_id')) {
        statusContent.innerHTML = `
            <div class="status-icon success">&#9881;</div>
            <h1>{{ .Params.portal_title }}</h1>
            <p>{{ .Params.portal_message }}</p>
            <a href="${homeUrl}" class="cta-button">{{ .Params.portal_cta }}</a>
        `;
    } else {
        statusContent.innerHTML = `
            <div class="status-icon error">&#10007;</div>
            <h1>{{ .Params.error_title }}</h1>
            <p>{{ .Params.error_message }}</p>
            <div class="details-box">
                <h3>{{ .Params.issues_title }}</h3>
                <ul>
                    {{ range .Params.issues }}
                    <li>{{ . }}</li>
                    {{ end }}
                </ul>
            </div>
            <div style="margin-top: 24px;">
                <a href="${pricingUrl}" class="cta-button">{{ .Params.try_again }}</a>
            </div>
            <a href="${supportUrl}" class="secondary-link">{{ .Params.contact_support }} &rarr;</a>
        `;
    }
</script>
{{ end }}
