{{ define "main" }}
<article class="p-doc">
    <h1 class="p-title">{{ .Title }}</h1>
    {{ with .Params.updated }}
    <p class="p-doc-updated">{{ . }}</p>
    {{ end }}

    {{ with .Params.tldr }}
    <div class="p-doc-tldr">
        <p><strong>TL;DR:</strong> {{ . }}</p>
    </div>
    {{ end }}

    <div class="prose">
        {{ .Content }}
    </div>
</article>
{{ end }}
