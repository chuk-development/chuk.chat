<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    {{- partial "head.html" . -}}
</head>
<body{{ with .Params.bodyClass }} class="{{ . }}"{{ end }}>
    {{- partial "nav.html" . -}}

    <div class="container">
        {{- block "main" . }}{{- end }}

        {{- partial "footer.html" . -}}
    </div>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('open');
        }

        // Measure KAO banner height and set CSS variable
        (function() {
            function updateBannerHeight() {
                const banner = document.querySelector('.kao-banner');
                if (banner) {
                    document.documentElement.style.setProperty('--kao-banner-height', banner.offsetHeight + 'px');
                } else {
                    document.documentElement.style.setProperty('--kao-banner-height', '0px');
                }
            }
            // Run after DOM is ready and periodically to catch dynamic insertion
            updateBannerHeight();
            const observer = new MutationObserver(updateBannerHeight);
            observer.observe(document.body, { childList: true, subtree: true });
            window.addEventListener('resize', updateBannerHeight);
        })();

        (function() {
            const starsCount = document.getElementById('githubStarsCount');
            if (!starsCount) {
                return;
            }

            fetch('https://api.github.com/repos/chuk-development/chuk_chat')
                .then((response) => {
                    if (!response.ok) {
                        throw new Error('Failed to load GitHub stars');
                    }
                    return response.json();
                })
                .then((data) => {
                    if (typeof data.stargazers_count === 'number') {
                        starsCount.textContent = new Intl.NumberFormat().format(data.stargazers_count);
                    }
                })
                .catch(() => {
                    starsCount.textContent = '--';
                });
        })();
    </script>
    {{- block "scripts" . }}{{- end }}
</body>
</html>
